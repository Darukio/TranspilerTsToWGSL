services:
  transpilador:
    build: .
    image: transpilador-ts-wgsl
    # Solo el loopback del anfitrión: el servidor puede lanzar trabajo en la GPU.
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, graphics, compute, utility]
